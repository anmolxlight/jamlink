name: android-apk
on:
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npx expo prebuild --platform android --non-interactive
      # KGP resolves to 1.9.24 (react-native-gradle-plugin pins it), but the expo
      # template's ext.kotlinVersion=1.9.25 picks Compose compiler 1.5.15, which
      # hard-errors on a 1.9.24 compiler. Pin ext to what the compiler actually is.
      - run: printf '\norg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8\nkotlin.daemon.jvmargs=-Xmx4g\norg.gradle.workers.max=2\nkotlin.compiler.execution.strategy=in-process\nandroid.kotlinVersion=1.9.24\nbundleInDebug=true\n' >> android/gradle.properties
      - run: yes | sdkmanager --licenses
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: cd android && ./gradlew assembleDebug -x lint --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: JamLink-apk, path: mobile/android/app/build/outputs/apk/debug/app-debug.apk }
