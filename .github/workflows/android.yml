name: android-apk
on:
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npx expo prebuild --platform android --non-interactive
      - run: printf '\norg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8\nkotlin.daemon.jvmargs=-Xmx4g\norg.gradle.workers.max=2\nkotlin.compiler.execution.strategy=in-process\nbundleInDebug=true\n' >> android/gradle.properties
      - run: yes | sdkmanager --licenses
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: keytool -genkey -keystore $GITHUB_WORKSPACE/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=JamLink"
      - run: cd android && ./gradlew assembleRelease -x lint --stacktrace
        env:
          ORG_GRADLE_PROJECT_android_injected_signing_store_file: ${{ github.workspace }}/debug.keystore
          ORG_GRADLE_PROJECT_android_injected_signing_store_password: android
          ORG_GRADLE_PROJECT_android_injected_signing_key_alias: androiddebugkey
          ORG_GRADLE_PROJECT_android_injected_signing_key_password: android
      - uses: actions/upload-artifact@v4
        with: { name: JamLink-apk, path: mobile/android/app/build/outputs/apk/release/app-release.apk }
