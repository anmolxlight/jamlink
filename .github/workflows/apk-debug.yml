name: apk-debug
on:
  workflow_dispatch: {}
jobs:
  emu:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh release download v0.1.3 -R anmolxlight/jamlink -p '*.apk' -D /tmp/apkdir && ls -la /tmp/apkdir
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          emulator-options: -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb install /tmp/apkdir/app-release.apk
            adb shell am start -n com.jamlink.app/.MainActivity
            sleep 20
            echo '--- current-focus ---'
            adb shell dumpsys window | grep -m3 -i 'mCurrentFocus\|mFocusedApp' || true
            echo '--- crash-stack ---'
            adb logcat -d | grep -A45 -m1 -i 'FATAL EXCEPTION\|AndroidRuntime.*jamlink\|com.jamlink' || echo NO_FATAL_FOUND
            echo '--- rn-errors ---'
            adb logcat -d | grep -m20 -i 'ReactNativeJS\|Hermes\|SoLoader\|Expo.*[Ee]rror' || echo NO_RN_ERRORS
            adb shell screencap -p /sdcard/shot.png
            adb pull /sdcard/shot.png $GITHUB_WORKSPACE/shot.png
            adb logcat -d > $GITHUB_WORKSPACE/logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emu-debug
          path: |
            shot.png
            logcat.txt
