name: apk-debug
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to launch on the emulator
        required: true
        default: v0.1.7
jobs:
  emu:
    # ponytail: ubuntu + KVM, not macos-arm64. The arm64 emulator never booted
    # (runs 34436072997 / 34437036664 / 34437790666 all timed out waiting for boot).
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: gh release download "${{ inputs.tag }}" -R anmolxlight/jamlink -p '*.apk' -D /tmp/apkdir && ls -la /tmp/apkdir
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          disable-animations: true
          script: |
            adb install -r /tmp/apkdir/app-release.apk
            adb logcat -c
            adb shell am start -n com.jamlink.app/.MainActivity
            sleep 25
            adb logcat -d > "$GITHUB_WORKSPACE/logcat.txt"
            adb shell screencap -p /sdcard/shot.png && adb pull /sdcard/shot.png "$GITHUB_WORKSPACE/shot.png"

            echo '--- current-focus ---'
            adb shell dumpsys window | grep -i 'mCurrentFocus\|mFocusedApp' || true
            echo '--- crashes ---'
            grep -i -A40 'FATAL EXCEPTION' "$GITHUB_WORKSPACE/logcat.txt" || echo NO_FATAL_FOUND
            echo '--- rn ---'
            grep -i 'ReactNativeJS\|has not been registered\|SoLoader\|Hermes' "$GITHUB_WORKSPACE/logcat.txt" | head -30 || true

            # ponytail: the whole point is "does it stay open" -- assert it, don't eyeball it.
            if grep -q 'FATAL EXCEPTION' "$GITHUB_WORKSPACE/logcat.txt"; then
              echo "::error::app crashed at launch"; exit 1
            fi
            if ! adb shell dumpsys window | grep -q 'com.jamlink.app/com.jamlink.app.MainActivity'; then
              echo "::error::jamlink is not the focused window after 25s -- app did not stay open"; exit 1
            fi
            echo "OK: jamlink launched and is still in the foreground"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emu-debug
          path: |
            shot.png
            logcat.txt
